---

# Tests the scripts of the image, builds the image for amd64 and smoke tests
#  it: the container is started with NAS-like resource limits, test videos are
#  opened and cuts are exported.
# Screenshots and logs are uploaded as an artifact.
# The arm images are built too (emulated, too slow to run LosslessCut), which
#  checks that no library is missing on those architectures.

name: Build and test

on:
  push:
    paths-ignore:
      - README.md
      - LICENSE
      - .gitignore
      - docker-compose*.yaml
  pull_request:
  workflow_dispatch: # will allow running manually

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test scripts (segments from file names, default settings, trash)
        run: helper-scripts/test-scripts.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: losslesscut:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

      - name: Install VNC client for screenshots
        run: pipx install vncdotool

      # Drives the runner's Chrome to check the side panel of the web page
      - name: Install browser automation
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ui-check" playwright-core@1

      - name: Smoke test
        env:
          OUT_DIR: ${{ runner.temp }}/smoke-test-output
          NODE_PATH: ${{ runner.temp }}/ui-check/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: helper-scripts/smoke-test.sh losslesscut:ci

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-output
          path: ${{ runner.temp }}/smoke-test-output
          if-no-files-found: ignore

  build-arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/arm64
          - linux/arm/v7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache scope
        id: scope
        run: echo "name=ci-${PLATFORM//\//-}" | tee -a "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ steps.scope.outputs.name }}
          cache-to: type=gha,scope=${{ steps.scope.outputs.name }},mode=max
