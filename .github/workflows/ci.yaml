---

# Builds the image for amd64 and smoke tests it: the container is started with
#  NAS-like resource limits, a test video is opened and a cut is exported.
# Screenshots and logs are uploaded as an artifact.

name: Build and test

on:
  push:
    paths-ignore:
      - README.md
      - LICENSE
      - .gitignore
      - docker-compose*.yaml
  pull_request:
  workflow_dispatch: # will allow running manually

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: losslesscut:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

      - name: Install VNC client for screenshots
        run: pipx install vncdotool

      - name: Smoke test
        env:
          OUT_DIR: ${{ runner.temp }}/smoke-test-output
        run: helper-scripts/smoke-test.sh losslesscut:ci

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-output
          path: ${{ runner.temp }}/smoke-test-output
          if-no-files-found: ignore
