# Background trimming: its status page (/autotrim/) and its API, used by the
#  page, the side panel section "Auto-trim" and the status box over LosslessCut,
#  see /opt/losslesscut-tools/autotrim.cjs
location /autotrim/ {
	# Pass information of the sender.
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Real-IP $remote_addr;

	proxy_pass http://unix:/tmp/autotrim.sock:/;
}

# Status page without the trailing slash
location = /autotrim {
	absolute_redirect off;
	return 301 autotrim/;
}
