# API of the background trimming (side panel section "Auto-trim"),
#  see /opt/losslesscut-tools/autotrim.cjs
location /autotrim/ {
	# Pass information of the sender.
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Real-IP $remote_addr;

	proxy_pass http://unix:/tmp/autotrim.sock:/;
}
