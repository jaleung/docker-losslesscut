---

# This is an example compose file, adjust to your needs
# For a QNAP NAS (Container Station) see docker-compose.qnap.yaml

name: losslesscut

services:
  losslesscut:
    image: ghcr.io/jaleung/docker-losslesscut:latest
    build: .
    restart: unless-stopped
    ports:
      - 5800:5800/tcp
    volumes:
      # Configuration directory, beware of permissions
      #- ./config:/config:rw
      # Video files will be looked for here
      - ${HOME?}:/storage:rw
      # Alternative path matching the host
      - ${HOME}:${HOME}:rw
    # Uncomment to enable hardware accelerated decoding (Intel/AMD GPUs)
    #devices:
    #  - /dev/dri:/dev/dri
    environment:
      WEB_AUDIO: ${WEB_AUDIO:-1}
      DARK_MODE: ${DARK_MODE:-1}
      SECURE_CONNECTION: ${SECURE_CONNECTION:-1}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
